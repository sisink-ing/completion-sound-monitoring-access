[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "completion-sound-monitoring"
version = "1.1.0"
description = "Research code for completion-sound monitoring under delayed, out-of-order labels"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "pandas>=2,<3", "scipy>=1.11,<2", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
completion_monitoring = ["engines/*.py"]
